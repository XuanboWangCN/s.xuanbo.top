<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <script src="simple-notice/index.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简·搜索</title>
    <script>
      // 立即设置主题防止闪烁
      // 1. 全局开启进度条
      SimpleNotify.configure({ showProgressBar: true });
      (function() {
          const savedTheme = localStorage.getItem('theme') || 'light';
          document.documentElement.setAttribute('data-bs-theme', savedTheme);
      })();

  </script>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./ico.png" type="image/png">
    <script src="UIsettings.js"></script>
    <script src="theme.js"></script>
    <style>
        .settings-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 1200;
            backdrop-filter: blur(4px);
        }
        .settings-overlay.hidden {
            display: none;
        }
        .settings-modal {
            width: min(980px, 100%);
            max-height: calc(100vh - 40px);
            background: var(--bs-body-bg, #ffffff);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
        }
        .settings-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.85rem 1rem;
            background: var(--bs-tertiary-bg, #f8f9fa);
            border-bottom: 1px solid var(--bs-border-color, #dee2e6);
        }
        .settings-modal-title {
            margin: 0;
            font-size: 1rem;
            font-weight: 600;
            color: var(--bs-body-color, #222);
        }
        .settings-modal-close {
            background: transparent;
            border: 0;
            color: var(--bs-body-color, #222);
            font-size: 1.5rem;
            line-height: 1;
            cursor: pointer;
            padding: 0;
        }
        .settings-modal iframe {
            width: 100%;
            height: calc(100vh - 76px);
            border: 0;
            background: transparent;
        }
        @media (max-width: 768px) {
            .settings-modal {
                width: 100%;
                height: 100%;
                max-height: none;
                border-radius: 0;
            }
            .settings-modal iframe {
                height: calc(100vh - 56px);
            }
        }
    </style>
</head>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw.js').then(function(registration) {
      console.log('ServiceWorker 注册成功:', registration.scope);
    }, function(err) {
      console.log('ServiceWorker 注册失败:', err);
    });
  });
}
</script>
<body>
    <div class="weather-display" id="weatherDisplay"></div>
    <div class="container">
        <h1 class="search-title">简·搜索</h1>
        <div class="search-subtitle" id="searchSubtitle">将使用 Microsoft Bing 进行搜索</div>
        
        <div class="search-row">
            <div class="engine-selector">
                <select id="engineSelect"></select>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="输入搜索内容..." autocomplete="off" autofocus>
                <button id="searchButton">搜索</button>
            </div>
        </div>
        <ul id="suggestions"></ul>
        <br>
        <div class="quick-links" id="quickLinks"></div>
    </div>

    <div class="footer">
        <div class="hitokoto" id="hitokoto"></div>
        <div class="links">
            <a href="./function/settings/index.html" class="open-settings-link">设置</a> | Powered by<a href="http://xuanbo.top" target="_blank">Xuanbo.top</a>
        </div>
        <div class="links-OnlySettings">
            <a href="./function/settings/index.html" class="open-settings-link">设置</a>
        </div>
    </div>
    <div id="settingsOverlay" class="settings-overlay hidden" aria-hidden="true">
        <div class="settings-modal" role="dialog" aria-modal="true" aria-label="设置">
            <div class="settings-modal-header">
                <h2 class="settings-modal-title">设置</h2>
                <button id="closeSettingsOverlay" class="settings-modal-close" type="button" aria-label="关闭设置">×</button>
            </div>
            <iframe id="settingsIframe" src="./function/settings/index.html" title="简·搜索 设置页面"></iframe>
        </div>
    </div>
    <script src="script.js"></script>
    <script src="title.js"></script>
</body>
</html>
