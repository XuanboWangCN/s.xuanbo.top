<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>隐私政策 - 简·搜索</title>
  <script src="../simple-notice/index.js" async></script>
  <script src="../theme.js"></script>
  <script src="../UIsettings.js"></script>
  <link href="../bootstrap-5.3.8-dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <link rel="icon" href="../ico.png" type="image/png">
  <style>
    .policy-wrapper {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .policy-header {
      margin-bottom: 2rem;
    }

    .policy-header h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      font-weight: 500;
      color: var(--bs-body-color);
    }

    .policy-content {
      line-height: 1.8;
      color: var(--bs-body-color);
    }

    .policy-section {
      margin-bottom: 2rem;
      padding: 1.5rem;
      border-radius: 8px;
      background-color: var(--bs-tertiary-bg);
      border: 1px solid var(--bs-border-color);
      transition: all 0.3s ease;
    }

    .policy-section h2 {
      font-size: 1.1rem;
      font-weight: 500;
      margin-bottom: 1rem;
      color: var(--bs-body-color);
    }

    .policy-section p {
      margin-bottom: 0.75rem;
      font-size: 0.95rem;
    }

    .policy-section p:last-child {
      margin-bottom: 0;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 1.5rem;
      color: var(--bs-link-color);
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .policy-wrapper {
        padding: 0 0.5rem;
        margin: 1rem auto;
      }

      .policy-header h1 {
        font-size: 1.5rem;
      }

      .policy-section {
        padding: 1rem;
      }
    }
  </style>
</head>
<body class="bg-body-tertiary">
  <div class="policy-wrapper">
    <a href="../" class="back-link">← 返回首页</a>

    <div class="policy-header">
      <h1>简·搜索 隐私政策</h1>
    </div>

    <div class="policy-content">
      <div class="policy-section">
        <h2>搜索数据</h2>
        <p></p>我们不会收集你的搜索数据。你的搜索内容仅会与搜索建议提供商 Microsoft Bing 共享，因此数据仅用于搜索建议服务。</p>
        <h2>位置信息</h2>
        <p>如果你启用天气显示，位置信息会与 OpenWeatherMap 共享，用于获取本地天气信息。</p>
        <h2>数据存储</h2>
        <p>所有设置和数据均存储在本地，目前没有在线同步功能。</p>
      </div>
    </div>
  </div>

  <div style="text-align:center; margin-top:2rem; margin-bottom:1.5rem; color: var(--bs-secondary-color); font-size: 0.9rem;">
    简·搜索
    <p>Copyright © <a href="https://github.com/XuanboWangCN" target="_blank">XuanboWang</a> 2025. All rights reserved.<br>
    Powered by <a href="https://xuanbo.top" target="_blank">Xuanbo.top</a><br></p>
  </div>

  <script src="../bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
  <script src="../script.js"></script>
</body>
</html>
